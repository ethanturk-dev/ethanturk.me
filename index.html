<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ethanturk.me test</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --term-bg: #161b22;
      --text-green: #3fb950;
      --text-cyan: #58a6ff;
      --text-white: #c9d1d9;
      --text-muted: #8b949e;
      --prompt-path: #d2a8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Terminal Interface */
    .terminal {
      width: 100%;
      max-width: 800px;
      height: 480px;
      background-color: var(--term-bg);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      background-color: #21262d;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .btn-close { background-color: #ff5f56; }
    .btn-min { background-color: #ffbd2e; }
    .btn-max { background-color: #27c93f; }

    .title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-right: 48px;
    }

    .terminal-body {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }

    .prompt {
      color: var(--text-green);
    }

    .prompt .path {
      color: var(--prompt-path);
    }

    .input-line {
      display: flex;
      align-items: center;
      margin-top: 5px;
    }

    .input-line input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      margin-left: 8px;
    }

    .output {
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .quick-cmds {
      padding: 10px 20px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cmd-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: var(--text-cyan);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .cmd-btn:hover {
      background: #30363d;
    }

    /* Full-Screen Unity Game Overlay */
    #game-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 100;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-game-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      background: #ff5f56;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      z-index: 101;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .close-game-btn:hover {
      background: #e04b43;
    }
  </style>
</head>
<body>

  <!-- Terminal Window -->
  <div class="terminal" id="terminal-window" onclick="document.getElementById('cli').focus()">
    <div class="terminal-header">
      <div class="buttons">
        <div class="btn btn-close"></div>
        <div class="btn btn-min"></div>
        <div class="btn btn-max"></div>
      </div>
      <div class="title">ethan@ethanturk.me:~</div>
    </div>

    <div class="terminal-body" id="terminal-body">
      <div id="history">
        <div class="output">Welcome to <span style="color: var(--text-cyan)">ethanturk.me</span>
Type <span style="color: var(--text-green)">'play'</span> to launch the game.
--------------------------------------------------</div>
      </div>

      <div class="input-line">
        <span class="prompt">guest@ethanturk.me:<span class="path">~</span>$</span>
        <input type="text" id="cli" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="quick-cmds">
      <button class="cmd-btn" style="color: var(--text-green);" onclick="runCmd('play')">▶ Launch Game</button>
      <button class="cmd-btn" onclick="runCmd('placeholder1')">Placeholder 1</button>
      <button class="cmd-btn" onclick="runCmd('placeholder2')">Placeholder 2</button>
      <button class="cmd-btn" onclick="runCmd('clear')">clear</button>
    </div>
  </div>

  <!-- Game Full-Screen View -->
  <div id="game-container">
    <button class="close-game-btn" onclick="closeGame()">[X] Exit Game</button>
    <iframe id="game-frame" src=""></iframe>
  </div>

  <script>
    const cli = document.getElementById('cli');
    const history = document.getElementById('history');
    const body = document.getElementById('terminal-body');
    const gameContainer = document.getElementById('game-container');
    const gameFrame = document.getElementById('game-frame');

    // Add or edit custom commands here in the future
    const commands = {
      help: `Available Commands:
  play / game  - Launch Unity WebGL game
  placeholder1 - (Future feature placeholder)
  placeholder2 - (Future feature placeholder)
  clear        - Clear terminal screen`,

      placeholder1: `[PLACEHOLDER 1]: Add your future text or links here!`,
      placeholder2: `[PLACEHOLDER 2]: Add your future text or links here!`
    };

    cli.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const input = cli.value.trim().toLowerCase();
        cli.value = '';
        if (input !== '') {
          executeCommand(input);
        }
      }
    });

    function executeCommand(cmd) {
      const line = document.createElement('div');
      line.className = 'output';
      line.innerHTML = `<span class="prompt">guest@ethanturk.me:<span class="path">~</span>$</span> ${escapeHTML(cmd)}`;
      history.appendChild(line);

      const response = document.createElement('div');
      response.className = 'output';

      if (cmd === 'play' || cmd === 'game') {
        response.innerHTML = `<span style="color: var(--text-green)">Launching game...</span>`;
        launchGame();
      } else if (cmd === 'clear') {
        history.innerHTML = '';
        return;
      } else if (commands[cmd]) {
        response.innerText = commands[cmd];
      } else {
        response.innerText = `Command not recognized: '${cmd}'. Type 'help' or 'play'.`;
      }

      history.appendChild(response);
      body.scrollTop = body.scrollHeight;
    }

    function launchGame() {
      // Points directly to Unity export inside the /game folder
      gameFrame.src = './game/index.html'; 
      gameContainer.style.display = 'block';
    }

    function closeGame() {
      gameContainer.style.display = 'none';
      gameFrame.src = ''; // Stops Unity audio and performance usage in background
      cli.focus();
    }

    function runCmd(cmd) {
      executeCommand(cmd);
      cli.focus();
    }

    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
