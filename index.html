<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>still ethanturk.me</title>
<style>
:root {
  --bg-color: #000000;
  --text-green: #3fb950;
  --text-white: #ffffff;
  --border-color: #333333;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-color);
  color: var(--text-white);
  font-family: 'Courier New', Courier, monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.start-btn {
  background: #000000;
  border: 1px solid var(--border-color);
  color: var(--text-green);
  padding: 14px 28px;
  border-radius: 0;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
}

.start-btn:hover {
  background: #111111;
  border-color: var(--text-green);
}

#game-container {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000000;
  z-index: 100;
}

#game-frame {
  width: 100%;
  height: 100%;
  border: none;
}

.close-game-btn {
  position: fixed;
  top: 15px;
  right: 20px;
  background: #000000;
  color: #ffffff;
  border: 1px solid var(--border-color);
  padding: 8px 16px;
  font-family: inherit;
  font-weight: bold;
  border-radius: 0;
  cursor: pointer;
  z-index: 101;
}

.close-game-btn:hover {
  background: #222222;
  border-color: #ffffff;
}
</style>
</head>
<body>

<button class="start-btn" onclick="launchGame()">▶ start game</button>

<div id="game-container">
  <button class="close-game-btn" onclick="closeGame()">[X] exit</button>
  <iframe id="game-frame" src=""></iframe>
</div>

<script>
const gameContainer = document.getElementById('game-container');
const gameFrame = document.getElementById('game-frame');

function launchGame() {
  gameFrame.src = './game/index.html';
  gameContainer.style.display = 'block';
}

function closeGame() {
  gameContainer.style.display = 'none';
  gameFrame.src = '';
}
</script>

</body>
</html>
